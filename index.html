<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Upload</title>
<style>
  :root{
    --bg:#0d0f10;
    --panel:#151718;
    --soft:#1b1e20;
    --line:#2a2f33;
    --line-dark:#3a4146;
    --text:#b8bec4;
    --muted:#7f878e;
    --accent:#23282c;
    --ok:#42d66b;
    --err:#ff6b6b;
    --green:#35d05b;
    --radius:10px;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  }

  body{padding:52px 18px 70px}

  .container{
    width:min(860px,100%);
    margin:0 auto;
  }

  .header{margin-bottom:22px}

  h1{
    margin:0 0 7px;
    font-size:32px;
    font-weight:600;
    letter-spacing:-.02em;
  }

  .sub{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  .upload-box{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--panel);
  }

  .drop-zone{
    min-height:285px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    padding:30px;
    background:var(--soft);
    border-bottom:1px solid var(--line);
    transition:.15s ease;
  }

  .drop-zone:hover,
  .drop-zone.drag{background:#202427}

  .drop-icon{
    width:54px;
    height:54px;
    margin:0 auto 16px;
    border:1px solid var(--line-dark);
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:23px;
    background:#181b1d;
  }

  .drop-title{
    font-size:19px;
    font-weight:600;
    margin-bottom:7px;
  }

  .drop-text{
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
  }

  input[type=file]{display:none}

  .queue{
    display:none;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    align-items:center;
    gap:13px;
  }

  .queue.show{display:flex}

  .queue img{
    width:58px;
    height:58px;
    object-fit:cover;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--soft);
  }

  .queue-info{
    min-width:0;
    flex:1;
  }

  .queue-name{
    font-size:14px;
    font-weight:600;
    word-break:break-all;
  }

  .queue-size{
    margin-top:5px;
    font-size:12px;
    color:var(--muted);
  }

  .toolbar{
    padding:13px 16px;
    display:flex;
    gap:9px;
    justify-content:flex-end;
  }

  button{
    font:inherit;
    cursor:pointer;
    border-radius:7px;
    border:1px solid var(--line-dark);
    padding:9px 15px;
    background:#181b1d;
    color:var(--text);
  }

  button.primary{
    background:#22272b;
    border-color:#343b40;
    color:#c7ccd1;
  }

  button.primary:hover,
  button:hover{border-color:#596168}

  button:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  .status{
    min-height:22px;
    margin:15px 2px 0;
    font-size:14px;
    color:var(--muted);
  }

  .status.ok{color:var(--ok)}
  .status.err{color:var(--err)}

  .results{
    display:none;
    margin-top:26px;
  }

  .results.show{display:block}

  .tabs{
    display:flex;
    gap:0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }

  .tab{
    border:0;
    border-bottom:2px solid transparent;
    border-radius:0;
    padding:10px 14px;
    color:var(--muted);
    background:#181b1d;
    white-space:nowrap;
  }

  .tab.active{
    color:var(--text);
    border-bottom-color:var(--text);
    font-weight:600;
  }

  .tab-panel{
    display:none;
    padding-top:16px;
  }

  .tab-panel.active{display:block}

  .preview-card{
    display:grid;
    grid-template-columns:240px 1fr;
    gap:22px;
    align-items:start;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }

  .preview-card img{
    width:100%;
    height:240px;
    object-fit:contain;
    background:var(--soft);
    border:1px solid var(--line);
    border-radius:8px;
  }

  .info-title{
    font-size:14px;
    font-weight:600;
    margin:2px 0 7px;
  }

  .result-line{
    display:flex;
    gap:8px;
    margin-bottom:13px;
  }

  .result-line input,
  textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--soft);
    color:var(--text);
    padding:10px 11px;
    font:13px/1.5 Consolas,Monaco,monospace;
  }

  textarea{
    min-height:105px;
    resize:vertical;
  }

  .copy-btn{flex:0 0 auto}

  .backend-info{
    margin-top:28px;
    border-top:1px solid var(--line);
    padding-top:14px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
  }

  .progress-wrap{
    display:none;
    margin-top:12px;
    height:7px;
    background:#202427;
    border:1px solid #2a3034;
    border-radius:999px;
    overflow:hidden;
  }

  .progress-wrap.show{display:block}

  .progress-bar{
    width:0%;
    height:100%;
    background:var(--green);
    transition:width .12s linear;
  }

  @media(max-width:700px){
    body{padding-top:28px}
    .preview-card{grid-template-columns:1fr}
    .preview-card img{height:220px}
    .drop-zone{min-height:230px}
  }
</style>
</head>

<body>
<main class="container">

  <div class="header">
    <h1>Image Upload</h1>
    <p class="sub">Drag & drop files here, or copy & paste a screenshot</p>
  </div>

  <section class="upload-box">

    <label class="drop-zone" id="dropZone">
      <div>
        <div class="drop-icon">↑</div>
        <div class="drop-title">Drag & drop files here</div>
        <div class="drop-text">
          or click to select an image<br>
          也可以直接 Ctrl + V 貼上截圖
        </div>
      </div>
      <input id="fileInput" type="file" accept="image/*">
    </label>

    <div class="queue" id="queue">
      <img id="queueThumb" alt="">
      <div class="queue-info">
        <div class="queue-name" id="queueName"></div>
        <div class="queue-size" id="queueSize"></div>
      </div>
    </div>

    <div class="toolbar">
      <button id="clearBtn" disabled>Clear</button>
      <button class="primary" id="uploadBtn" disabled>Upload</button>
    </div>

  </section>

  <div class="status" id="status"></div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <section class="results" id="results">

    <div class="tabs">
      <button class="tab active" data-tab="previewPanel">Preview</button>
      <button class="tab" data-tab="bbPanel">BBCode</button>
      <button class="tab" data-tab="htmlPanel">HTML</button>
      <button class="tab" data-tab="urlPanel">Image URL</button>
      <button class="tab" data-tab="mdPanel">Markdown</button>
    </div>

    <div class="tab-panel active" id="previewPanel">
      <div class="preview-card">
        <img id="uploadedThumb" alt="Uploaded image">

        <div>
          <div class="info-title">URL</div>
          <div class="result-line">
            <input id="previewUrl" readonly>
            <button class="copy-btn" data-copy="previewUrl">Copy</button>
          </div>

          <div class="info-title">HTML</div>
          <div class="result-line">
            <input id="previewHtml" readonly>
            <button class="copy-btn" data-copy="previewHtml">Copy</button>
          </div>

          <div class="info-title">BBCode</div>
          <div class="result-line">
            <input id="previewBb" readonly>
            <button class="copy-btn" data-copy="previewBb">Copy</button>
          </div>

          <div class="info-title">Markdown</div>
          <div class="result-line">
            <input id="previewMd" readonly>
            <button class="copy-btn" data-copy="previewMd">Copy</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="bbPanel">
      <textarea id="bbOut" readonly></textarea>
      <div style="margin-top:8px"><button data-copy="bbOut">Copy</button></div>
    </div>

    <div class="tab-panel" id="htmlPanel">
      <textarea id="htmlOut" readonly></textarea>
      <div style="margin-top:8px"><button data-copy="htmlOut">Copy</button></div>
    </div>

    <div class="tab-panel" id="urlPanel">
      <textarea id="urlOut" readonly></textarea>
      <div style="margin-top:8px"><button data-copy="urlOut">Copy</button></div>
    </div>

    <div class="tab-panel" id="mdPanel">
      <textarea id="mdOut" readonly></textarea>
      <div style="margin-top:8px"><button data-copy="mdOut">Copy</button></div>
    </div>

  </section>

  <section class="backend-info">
    Cloudflare Worker · my-image-bed-api
  </section>

</main>

<script>
(() => {
  /*
   * ========================================
   * CONFIG
   * ========================================
   */

  const WORKER_URL =
    'https://my-image-bed-api.komican2012.workers.dev';


  /*
   * ========================================
   * ELEMENTS
   * ========================================
   */

  const $ = id => document.getElementById(id);

  const dropZone = $('dropZone');
  const fileInput = $('fileInput');

  const queue = $('queue');
  const queueThumb = $('queueThumb');
  const queueName = $('queueName');
  const queueSize = $('queueSize');

  const uploadBtn = $('uploadBtn');
  const clearBtn = $('clearBtn');

  const status = $('status');
  const results = $('results');

  const progressWrap = $('progressWrap');
  const progressBar = $('progressBar');

  let currentFile = null;
  let localPreviewUrl = null;


  /*
   * ========================================
   * HELPERS
   * ========================================
   */

  function humanSize(bytes){
    if(bytes < 1024){
      return bytes + ' B';
    }

    if(bytes < 1024 * 1024){
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }


  function setStatus(text, type = ''){
    status.className =
      'status' + (type ? ' ' + type : '');

    status.textContent = text;
  }


  function escapeHtml(text){
    return String(text)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }


  /*
   * ========================================
   * FILE QUEUE
   * ========================================
   */

  function setFile(file){
    if(!file){
      return;
    }

    if(
      !file.type ||
      !file.type.startsWith('image/')
    ){
      setStatus(
        '請選擇圖片檔',
        'err'
      );

      return;
    }

    currentFile = file;

    if(localPreviewUrl){
      URL.revokeObjectURL(localPreviewUrl);
    }

    localPreviewUrl =
      URL.createObjectURL(file);

    queueThumb.src =
      localPreviewUrl;

    queueName.textContent =
      file.name;

    queueSize.textContent =
      humanSize(file.size);

    queue.classList.add('show');

    uploadBtn.disabled = false;
    clearBtn.disabled = false;

    results.classList.remove('show');

    setStatus('已選擇圖片');
  }


  function clearQueueOnly(){
    currentFile = null;
    fileInput.value = '';

    if(localPreviewUrl){
      URL.revokeObjectURL(
        localPreviewUrl
      );

      localPreviewUrl = null;
    }

    queue.classList.remove('show');

    queueThumb.removeAttribute('src');

    queueName.textContent = '';
    queueSize.textContent = '';

    uploadBtn.disabled = true;
    clearBtn.disabled = true;
  }


  function clearAll(){
    clearQueueOnly();

    results.classList.remove('show');

    progressWrap.classList.remove('show');
    progressBar.style.width = '0%';

    setStatus('');
  }


  /*
   * ========================================
   * FILE INPUT
   * ========================================
   */

  fileInput.addEventListener(
    'change',
    () => {
      setFile(
        fileInput.files[0]
      );
    }
  );


  /*
   * ========================================
   * DRAG AND DROP
   * ========================================
   */

  ['dragenter','dragover'].forEach(name => {
    dropZone.addEventListener(name, e => {
      e.preventDefault();

      dropZone.classList.add('drag');
    });
  });


  ['dragleave','drop'].forEach(name => {
    dropZone.addEventListener(name, e => {
      e.preventDefault();

      dropZone.classList.remove('drag');
    });
  });


  dropZone.addEventListener(
    'drop',
    e => {
      const file =
        e.dataTransfer.files?.[0];

      setFile(file);
    }
  );


  /*
   * ========================================
   * PASTE IMAGE
   * ========================================
   */

  document.addEventListener(
    'paste',
    e => {
      const items =
        e.clipboardData?.items;

      if(!items){
        return;
      }

      for(const item of items){
        if(
          item.type.startsWith('image/')
        ){
          const file =
            item.getAsFile();

          if(file){
            setFile(file);
            break;
          }
        }
      }
    }
  );


  /*
   * ========================================
   * CLEAR
   * ========================================
   */

  clearBtn.addEventListener(
    'click',
    clearAll
  );


  /*
   * ========================================
   * UPLOAD
   * ========================================
   */

  uploadBtn.addEventListener(
    'click',
    async () => {

      if(!currentFile){
        return;
      }

      const uploadingFile =
        currentFile;

      uploadBtn.disabled = true;

      setStatus('上傳中…');

      progressWrap.classList.add('show');
      progressBar.style.width = '0%';

      try{

        const form =
          new FormData();

        /*
         * Worker 使用的欄位名稱是 file
         */
        form.append(
          'file',
          uploadingFile,
          uploadingFile.name
        );


        /*
         * XMLHttpRequest 保留原本的
         * 上傳進度條功能
         */

        const raw =
          await new Promise(
            (resolve, reject) => {

              const xhr =
                new XMLHttpRequest();

              xhr.open(
                'POST',
                WORKER_URL + '/upload',
                true
              );


              xhr.upload.onprogress =
                event => {

                  if(
                    event.lengthComputable
                  ){
                    const percent =
                      Math.round(
                        (
                          event.loaded /
                          event.total
                        ) * 100
                      );

                    progressBar.style.width =
                      percent + '%';
                  }
                };


              xhr.onload = () => {

                if(
                  xhr.status >= 200 &&
                  xhr.status < 300
                ){
                  progressBar.style.width =
                    '100%';

                  resolve(
                    xhr.responseText
                  );
                }else{

                  let message =
                    'HTTP ' + xhr.status;

                  try{
                    const errorData =
                      JSON.parse(
                        xhr.responseText
                      );

                    if(errorData?.error){
                      message =
                        errorData.error;
                    }
                  }catch{}

                  reject(
                    new Error(message)
                  );
                }
              };


              xhr.onerror = () => {
                reject(
                  new Error(
                    '無法連線到 Cloudflare Worker'
                  )
                );
              };


              xhr.send(form);
            }
          );


        /*
         * Worker JSON
         */

        let data;

        try{
          data =
            JSON.parse(raw);
        }catch{
          throw new Error(
            'Worker 回傳格式不是 JSON'
          );
        }


        if(!data?.ok){
          throw new Error(
            data?.error ||
            'Worker 上傳失敗'
          );
        }


        const url =
          data.url;


        if(!url){
          throw new Error(
            '圖片已上傳，但 Worker 沒有回傳圖片網址'
          );
        }


        /*
         * 輸出格式
         */

        const filename =
          data.filename ||
          uploadingFile.name;

        const safeFilename =
          escapeHtml(filename);

        const markdown =
          `![${filename}](${url})`;

        const html =
          `<img src="${url}" alt="${safeFilename}">`;

        const bbcode =
          `[img]${url}[/img]`;


        /*
         * Preview
         */

        $('uploadedThumb').src =
          url;

        $('previewUrl').value =
          url;

        $('previewHtml').value =
          html;

        $('previewBb').value =
          bbcode;

        $('previewMd').value =
          markdown;


        /*
         * Tabs
         */

        $('urlOut').value =
          url;

        $('htmlOut').value =
          html;

        $('bbOut').value =
          bbcode;

        $('mdOut').value =
          markdown;


        results.classList.add('show');

        setStatus(
          '✓ Upload Complete',
          'ok'
        );

        clearQueueOnly();

        setTimeout(
          () => {
            progressWrap.classList.remove(
              'show'
            );
          },
          500
        );


        window.scrollTo({
          top:
            results.offsetTop - 20,

          behavior:
            'smooth'
        });

      }catch(err){

        const msg =
          String(
            err?.message || err
          );

        setStatus(
          '上傳失敗：' + msg,
          'err'
        );

        progressBar.style.width =
          '0%';

        progressWrap.classList.remove(
          'show'
        );

      }finally{

        uploadBtn.disabled =
          !currentFile;
      }
    }
  );


  /*
   * ========================================
   * TABS
   * ========================================
   */

  document
    .querySelectorAll('.tab')
    .forEach(tab => {

      tab.addEventListener(
        'click',
        () => {

          document
            .querySelectorAll('.tab')
            .forEach(
              x =>
                x.classList.remove(
                  'active'
                )
            );

          document
            .querySelectorAll(
              '.tab-panel'
            )
            .forEach(
              x =>
                x.classList.remove(
                  'active'
                )
            );

          tab.classList.add(
            'active'
          );

          $(
            tab.dataset.tab
          ).classList.add(
            'active'
          );
        }
      );
    });


  /*
   * ========================================
   * COPY
   * ========================================
   */

  document
    .querySelectorAll('[data-copy]')
    .forEach(btn => {

      btn.addEventListener(
        'click',
        async () => {

          const target =
            $(
              btn.dataset.copy
            );

          const value =
            target.value;

          try{

            await navigator
              .clipboard
              .writeText(value);

          }catch{

            target.focus();
            target.select();

            document.execCommand(
              'copy'
            );
          }


          const old =
            btn.textContent;

          btn.textContent =
            'Copied';

          setTimeout(
            () =>
              btn.textContent = old,
            850
          );
        }
      );
    });

})();
</script>

</body>
</html>
